services:
  app:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.dev
    init: true
    restart: unless-stopped
    ports:
      - target: 3000
        published: "3000"
        host_ip: 0.0.0.0
        protocol: tcp
      - target: 3000
        published: "3000"
        host_ip: "::"
        protocol: tcp
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_INTERNAL_URL: http://api-gw:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      NEXT_PUBLIC_APP_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: NDS Maintenance
      WATCHPACK_POLLING: "true"
    volumes:
      - ../..:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      api-gw:
        condition: service_healthy

  api-gw:
    ports:
      - "0.0.0.0:8000:8000/tcp"
      - "[::]:8000:8000/tcp"

  db:
    volumes:
      - ../../supabase/migrations:/project-migrations:ro

volumes:
  app_node_modules:
  app_next:
